<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Real-Time AI Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-3xl font-bold mb-4">Real-Time Vision & OCR Stream</h1>

        <!-- Mode Toggle Controls -->
        <div class="mb-6 flex justify-center space-x-4">
            <a href="?mode=yolo" 
               class="px-6 py-2 rounded-lg font-semibold {% if mode == 'yolo' %}bg-blue-600{% else %}bg-gray-700 hover:bg-gray-600{% endif %}">
                YOLO Object Detection
            </a>
            <a href="?mode=ocr" 
               class="px-6 py-2 rounded-lg font-semibold {% if mode == 'ocr' %}bg-green-600{% else %}bg-gray-700 hover:bg-gray-600{% endif %}">
                Tesseract Text Detection
            </a>
        </div>

        <!-- Live Camera Stream -->
        <div class="relative inline-block border-4 border-gray-700 rounded-lg overflow-hidden bg-black shadow-2xl">
            <img src="{% url 'video_feed' %}?mode={{ mode }}" 
                 alt="Live Camera Feed" 
                 class="w-full max-w-2xl h-auto">
        </div>

        <p class="mt-4 text-gray-400 text-sm">
            Current Active Mode: <span class="font-bold text-white uppercase">{{ mode }}</span>
        </p>
    </div>
</body>
</html>
