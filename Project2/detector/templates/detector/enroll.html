<!DOCTYPE html>
<html lang="en">
<head>
    <title>Enroll Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow space-y-4">
        <h2 class="text-xl font-bold text-gray-800">Student AI Face Enrollment</h2>
        
        <div>
            <label class="block text-sm font-medium">Full Name:</label>
            <input type="text" id="name" class="w-full border p-2 rounded mt-1" required>
        </div>
        <div>
            <label class="block text-sm font-medium">Roll Number / ID:</label>
            <input type="text" id="roll" class="w-full border p-2 rounded mt-1" required>
        </div>

        <div class="border rounded overflow-hidden">
            <video id="webcam" autoplay class="w-full h-64 bg-black object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <button onclick="captureAndEnroll()" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Capture & Register Face</button>
        <a href="{% url 'dashboard' %}" class="block text-center text-sm text-gray-600 hover:underline">Back to Dashboard</a>
    </div>

    <script>
    const video = document.getElementById('webcam');
    
    // Explicitly set video dimensions to match canvas
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => alert("Camera access denied or unavailable!"));

    function captureAndEnroll() {
        // Ensure video is actively playing before drawing
        if (video.readyState !== video.HAVE_ENOUGH_DATA) {
            return alert('Webcam is still loading. Please wait a second and try again!');
        }

        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Force standard JPEG output without alpha transparency
        const imageData = canvas.toDataURL('image/jpeg', 0.95);
        const name = document.getElementById('name').value.trim();
        const roll = document.getElementById('roll').value.trim();

        if(!name || !roll) return alert('Please enter both name and roll number!');

        fetch('/enroll/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({ name: name, roll_number: roll, image: imageData })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.status === 'success') window.location.href = '/';
        });
    }
    </script>
</body>
</html>
